models:
    - name: products_t
      description: "This model transforms the products data from the bronze layer to the silver layer."
      columns:
        - name: product_id
          description: "Unique identifier for each product."
          data_tests:
            - not_null
            - unique:
                config:
                  where: "price > 0"
    - name: orders_t
      description: "This model transforms the orders data from the bronze layer to the silver layer."
      columns:
        - name: order_id
          description: "Unique identifier for each order."
          data_tests:
            - not_null
            - unique